<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
<style>
:root {
  color-scheme: light;
  --surface-page:   #f9f9f7;
  --surface-card:   #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11,11,11,0.10);
  --series-1:       #2a78d6; /* จำเป็น */
  --series-2:       #eb6834; /* อื่นๆ */
  --good:           #0ca30c;
  --critical:       #d03b3b;
  --warning:        #eda100;
  --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.04);
  /* Fixed-order categorical palette for the category donut chart (max 8 slices). */
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100;
  --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-page:   #0d0d0d;
    --surface-card:   #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --good:           #0ca30c;
    --critical:       #e66767;
    --warning:        #c98500;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.3);
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
    --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", "Sarabun", sans-serif;
  background: var(--surface-page);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

.app-shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.topbar h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.01em; }
.topbar .subtitle { margin: 2px 0 0; color: var(--text-secondary); font-size: 0.85rem; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.user-info { display: flex; align-items: center; gap: 6px; padding-left: 8px; margin-left: 4px; border-left: 1px solid var(--gridline); }
.user-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--gridline); }
.user-name { font-size: 0.85rem; color: var(--text-secondary); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sign-in-gate {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--surface-page);
}
.sign-in-card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 40px 32px;
  max-width: 380px;
  width: 100%;
  text-align: center;
}
.sign-in-card h1 { font-size: 1.4rem; margin: 0 0 4px; }
.sign-in-card .subtitle { margin: 0 0 20px; color: var(--text-secondary); font-size: 0.85rem; }
.sign-in-message { color: var(--text-secondary); font-size: 0.85rem; margin: 0 0 20px; min-height: 1.2em; }
.gsi-button-container { display: flex; justify-content: center; }

.icon-btn {
  background: none;
  border: 1px solid transparent;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 6px 10px;
  border-radius: 8px;
}
.icon-btn:hover { background: var(--border); }

.pill-btn {
  border: none;
  border-radius: 999px;
  padding: 10px 20px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  background: var(--series-1);
  color: #fff;
}
.pill-btn:active { opacity: 0.85; }
.pill-btn.small { padding: 8px 14px; font-size: 0.85rem; }

.card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.card h3 {
  margin: 0 0 14px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.chart-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.chart-header h3 { margin: 0; }
.range-toggle { display: flex; gap: 4px; flex-shrink: 0; }
.range-toggle button {
  border: 1px solid var(--gridline);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.72rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
}
.range-toggle button.active { background: var(--series-1); border-color: var(--series-1); color: #fff; }

.chart-canvas-wrap { position: relative; height: 240px; }
.chart-canvas-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

.stat-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.stat-value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.delta-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  margin-top: 8px;
}
.delta-up { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
.delta-down { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.delta-neutral { background: var(--border); color: var(--text-muted); }

.total-card { display: flex; flex-direction: column; justify-content: center; }

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  align-items: start;
}
@media (min-width: 900px) {
  .dashboard-grid { grid-template-columns: 1.2fr 0.8fr; }
}

.form-row { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.form-row label { font-size: 0.8rem; color: var(--text-secondary); }
.form-row input, .form-row select {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--gridline);
  background: var(--surface-page);
  color: var(--text-primary);
  font-size: 1rem;
}

.primary-btn {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: var(--series-1);
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
.primary-btn:active { opacity: 0.85; }

.ghost-btn {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--gridline);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
}

.tx-list { display: flex; flex-direction: column; gap: 0; max-height: 480px; overflow-y: auto; }
.tx-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--gridline);
  gap: 10px;
}
.tx-row:last-child { border-bottom: none; }
.tx-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.tx-cat { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-meta { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amount { flex: 0 0 auto; min-width: 88px; text-align: right; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tx-actions { flex: 0 0 auto; display: flex; gap: 4px; }
.tx-actions button {
  background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; padding: 4px 6px;
}
.tx-actions button:hover { color: var(--text-primary); }
.empty-hint { color: var(--text-muted); font-size: 0.9rem; padding: 8px 0; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.dot-need { background: var(--series-1); }
.dot-other { background: var(--series-2); }

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
  vertical-align: middle;
  line-height: 1;
}
.cat-icon { font-size: 18px; margin-right: 6px; flex-shrink: 0; }
.cat-icon-need { color: var(--series-1); }
.cat-icon-other { color: var(--series-2); }

.icon-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 4px; }
.icon-choice {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid var(--gridline);
  background: var(--surface-page);
  color: var(--text-secondary);
  cursor: pointer;
  padding: 6px;
}
.icon-choice .material-symbols-outlined { font-size: 20px; }
.icon-choice:hover { border-color: var(--series-1); }
.icon-choice.active { background: var(--series-1); border-color: var(--series-1); color: #fff; }

.cat-manage-row.editing { align-items: flex-start; }
.cat-edit-fields { flex: 1 1 auto; min-width: 0; }
.cat-edit-top { display: flex; gap: 6px; margin-bottom: 8px; }

.month-picker {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 600;
  margin-bottom: 14px;
}
.month-label { font-size: 1.05rem; }

.group-bar {
  display: flex;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 10px;
  background: var(--gridline);
}
.group-bar span { height: 100%; }
.group-legend { display: flex; gap: 16px; font-size: 0.82rem; color: var(--text-secondary); }

.cat-row { margin-bottom: 10px; }
.cat-row-top { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 4px; }
.cat-bar-track { height: 6px; border-radius: 3px; background: var(--gridline); overflow: hidden; }
.cat-bar-fill { height: 100%; border-radius: 3px; }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text-primary);
  color: var(--surface-card);
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 0.88rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  max-width: 90%;
  text-align: center;
  z-index: 20;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface-card);
  border-radius: 14px;
  padding: 22px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow);
}
.modal h3 { margin: 0 0 16px; font-size: 1.05rem; text-transform: none; letter-spacing: normal; color: var(--text-primary); font-weight: 700; }
.modal-actions { display: flex; gap: 8px; margin-top: 4px; }

.cat-manage-list { max-height: 320px; overflow-y: auto; margin-bottom: 16px; }
.cat-manage-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--gridline);
}
.cat-manage-row:last-child { border-bottom: none; }
.cat-manage-name { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-manage-row input[type="text"], .cat-manage-row select {
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid var(--gridline);
  background: var(--surface-page);
  color: var(--text-primary);
  font-size: 0.86rem;
}
.cat-manage-row input[type="text"] { flex: 1 1 auto; min-width: 0; }
.cat-manage-actions { flex: 0 0 auto; display: flex; gap: 2px; }
.cat-manage-actions button {
  background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; padding: 4px 6px;
}
.cat-manage-actions button:hover { color: var(--text-primary); }
.cat-add-inline { display: flex; gap: 6px; }
.cat-add-inline input[type="text"] { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>

<div id="signInGate" class="sign-in-gate">
  <div class="sign-in-card">
    <h1>Expense Tracker</h1>
    <p class="subtitle">Personal Finance Dashboard</p>
    <p class="sign-in-message" id="signInMessage"></p>
    <div class="gsi-button-container" id="gsiButton"></div>
  </div>
</div>

<div class="app-shell" id="appShell" style="display:none;">

  <header class="topbar">
    <div>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Personal Finance Dashboard</p>
    </div>
    <div class="topbar-actions">
      <button id="addBtn" class="pill-btn">+ เพิ่มรายการ</button>
      <button id="categoryBtn" class="icon-btn" title="จัดการหมวดหมู่">🏷️</button>
      <div class="user-info" id="userInfo" style="display:none;">
        <img class="user-avatar" id="userAvatar" alt="">
        <span class="user-name" id="userName"></span>
        <button id="signOutBtn" class="icon-btn" title="ออกจากระบบ">🚪</button>
      </div>
    </div>
  </header>

  <div class="dashboard-grid">
    <div class="card">
      <div class="month-picker">
        <button id="prevMonth" class="icon-btn">‹</button>
        <span id="monthLabel" class="month-label"></span>
        <button id="nextMonth" class="icon-btn">›</button>
      </div>
      <div class="group-bar" id="groupBar"></div>
      <div class="group-legend" id="groupLegend"></div>
    </div>

    <div class="card total-card">
      <div class="stat-label">Total · <span id="statMonthLabel"></span></div>
      <div class="stat-value" id="statTotal">–</div>
      <div id="statDelta"></div>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="col-main">
      <div class="card">
        <h3>By Category</h3>
        <div id="categoryBreakdown"></div>
      </div>

      <div class="card">
        <h3>Transactions This Month</h3>
        <div id="monthList" class="tx-list"></div>
      </div>
    </div>

    <div class="col-side">
      <div class="card">
        <div class="chart-header">
          <h3>Monthly Spending Trend</h3>
          <div class="range-toggle" id="trendRangeToggle">
            <button data-range="12" class="active">1Y</button>
            <button data-range="24">2Y</button>
            <button data-range="36">3Y</button>
            <button data-range="ALL">All</button>
          </div>
        </div>
        <div class="chart-canvas-wrap"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="card">
        <h3>Spending by Category (Last 12 Months)</h3>
        <div class="chart-canvas-wrap"><canvas id="rankChart"></canvas></div>
      </div>
      <button id="exportBtn" class="ghost-btn">⬇ ส่งออกเป็น CSV</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- ADD / EDIT TRANSACTION MODAL -->
<div id="txModal" class="modal-overlay">
  <div class="modal">
    <h3 id="txModalTitle">Add Transaction</h3>
    <form id="addForm">
      <div class="form-row">
        <label>วันที่</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="form-row">
        <label>หมวดหมู่</label>
        <select id="f-category" required></select>
      </div>
      <div class="form-row">
        <label>จำนวนเงิน</label>
        <input type="number" id="f-amount" step="0.01" inputmode="decimal" placeholder="0.00" required>
      </div>
      <div class="form-row">
        <label>โน้ต</label>
        <input type="text" id="f-note" placeholder="(ไม่บังคับ)">
      </div>
      <div class="modal-actions">
        <button type="submit" class="primary-btn" id="f-submit">เพิ่มรายการ</button>
        <button type="button" class="ghost-btn" id="f-cancel">ยกเลิก</button>
      </div>
    </form>
  </div>
</div>

<!-- CATEGORY MANAGEMENT MODAL -->
<div id="categoryModal" class="modal-overlay">
  <div class="modal">
    <h3>Manage Categories</h3>
    <div id="categoryManageList" class="cat-manage-list"></div>
    <div class="form-row">
      <label>เพิ่มหมวดหมู่ใหม่</label>
      <div class="cat-add-inline">
        <input type="text" id="nc-name" placeholder="ชื่อหมวดหมู่">
        <select id="nc-group">
          <option value="จำเป็น">จำเป็น</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>
      <div class="icon-picker" id="nc-icon-picker"></div>
      <button id="nc-add" class="pill-btn small" style="margin-top:8px; width:100%;">+ เพิ่ม</button>
    </div>
    <div class="modal-actions">
      <button id="cat-close" class="ghost-btn">ปิด</button>
    </div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);

// ---------- Config ----------
// These are fixed for this deployment (not per-user secrets) — fill them in
// once before hosting this file, so visitors never see or need to touch
// them. Who can actually sign in and use the app is controlled separately,
// via the AllowedUsers sheet in Code.gs — not by hiding these values.
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzDwhyTs_9yTrhu8S9pE8z5iMkyLkymz80ePHwScf9LyntWowtZHTurVmw1ZskLzPxRQQ/exec';
const GOOGLE_CLIENT_ID = '379090037025-l0i3uhi4ble883dahu57q50hhgtj0csb.apps.googleusercontent.com';

const CACHE_KEY = 'expenseApp.cache';

// ---------- State ----------
const state = {
  transactions: [], // {id,date,category,group,amount,note,createdAt}
  categories: [],   // {name,group,sortOrder}
  editingId: null,
  monthCursor: null, // {y,m} currently browsed month
  trendRange: 12,    // months shown in the trend chart, or 'ALL'
  idToken: null,      // Google Identity Services ID token for the current session
  userProfile: null,  // {email, name, picture} decoded from idToken, for display only
};

const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THAI_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

// Curated Material Symbols (monotone, single-color icon font) choices for categories.
const ICON_CHOICES = [
  'restaurant','home','apartment','wifi','water_drop','bolt','directions_car',
  'shopping_bag','family_restroom','group','shopping_cart','flight',
  'local_hospital','school','pets','fitness_center','celebration','savings',
  'credit_card','local_cafe','sports_esports','subscriptions','build',
  'receipt_long','redeem','spa','help','sell',
];
// Fallback icons for categories created before the Icon column existed
// (or any category whose Icon cell is still blank).
const DEFAULT_ICON_MAP = {
  'อาหาร': 'restaurant',
  'คอนโดฯ': 'home',
  'ส่วนกลาง': 'apartment',
  'ค่าโทรศัพท์/เน็ต': 'wifi',
  'ค่าน้ำ': 'water_drop',
  'ค่าไฟ': 'bolt',
  'ค่าเดินทาง': 'directions_car',
  'ช็อปปิ้ง + อื่นๆ': 'shopping_bag',
  'ป๊า + ม๊า': 'family_restroom',
  'บ่น + นันท์': 'group',
  'ของใช้จำเป็น': 'shopping_cart',
  'เที่ยว': 'flight',
  'ไม่ระบุ': 'help',
};

function iconForCategoryName(name) {
  const c = state.categories.find(c => c.name === name);
  if (c && c.icon) return c.icon;
  return DEFAULT_ICON_MAP[name] || 'sell';
}

function renderIconPicker(containerId, selectedIcon, onSelect) {
  const el = document.getElementById(containerId);
  el.innerHTML = ICON_CHOICES.map(icon => `
    <button type="button" class="icon-choice ${icon === selectedIcon ? 'active' : ''}" data-icon="${icon}" title="${icon}">
      <span class="material-symbols-outlined">${icon}</span>
    </button>`).join('');
  el.querySelectorAll('.icon-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.icon-choice').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      onSelect(btn.dataset.icon);
    });
  });
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtMoney(n) {
  return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function monthKeyOf(dateStr) { return dateStr.slice(0, 7); } // YYYY-MM

// The cache is keyed per signed-in account (not a single shared key) — the
// browser's localStorage has no idea which Google account is "currently"
// signed in, so a shared key would show whoever loaded this browser last,
// even briefly, before the real authenticated fetch overwrites it.
function cacheKeyFor(email) { return CACHE_KEY + '::' + email; }

function persistCache() {
  if (!state.userProfile) return;
  localStorage.setItem(cacheKeyFor(state.userProfile.email), JSON.stringify({ transactions: state.transactions, categories: state.categories }));
}

function clearAllCaches() {
  Object.keys(localStorage)
    .filter(k => k.indexOf(CACHE_KEY) === 0)
    .forEach(k => localStorage.removeItem(k));
}

// ---------- API ----------
// All calls go through POST — an ID token is ~1000+ characters, and passing
// it as a GET query param risks exceeding Apps Script's URL-length handling
// (surfaces as a 404 from the redirect it does internally). Code.gs's doGet
// still accepts the same actions for manual/curl testing.
const api = {
  async post(action, payload) {
    if (!state.idToken) throw new Error('AUTH_REQUIRED');
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload, idToken: state.idToken }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  },
};

// ---------- Toast ----------
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ---------- Google Sign-In ----------
let gisInitialized = false;

function initApp() {
  if (WEB_APP_URL.indexOf('PASTE_YOUR') === 0 || GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR') === 0) {
    showSignInGate('ยังไม่ได้ตั้งค่า WEB_APP_URL / GOOGLE_CLIENT_ID ในไฟล์ index.html — แก้ค่าคงที่ด้านบนของ <script> ก่อนใช้งาน');
    return;
  }
  showSignInGate('กำลังตรวจสอบการเข้าสู่ระบบ...');
  initGoogleSignIn();
}

function initGoogleSignIn() {
  if (!window.google || !google.accounts || !google.accounts.id) {
    setTimeout(initGoogleSignIn, 300);
    return;
  }
  if (!gisInitialized) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      auto_select: true,
    });
    gisInitialized = true;
  }
  const el = document.getElementById('gsiButton');
  el.innerHTML = '';
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' });
  google.accounts.id.prompt(); // try silent one-tap sign-in if the browser already has a session
}

function decodeJwtPayload(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(base64).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
    return JSON.parse(json);
  } catch (e) { return null; }
}

function handleCredentialResponse(response) {
  state.idToken = response.credential;
  const payload = decodeJwtPayload(response.credential);
  state.userProfile = payload ? { email: payload.email, name: payload.name, picture: payload.picture } : null;
  // Reset in-memory data so nothing from a previous account (e.g. switching
  // accounts without an explicit sign-out) can render even for an instant.
  state.transactions = [];
  state.categories = [];
  showApp();
  bootstrap();
}

function showSignInGate(message) {
  document.getElementById('signInMessage').textContent = message || '';
  document.getElementById('signInGate').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
}

function showApp() {
  document.getElementById('signInGate').style.display = 'none';
  document.getElementById('appShell').style.display = '';
  renderUserInfo();
}

function renderUserInfo() {
  const el = document.getElementById('userInfo');
  if (!state.userProfile) { el.style.display = 'none'; return; }
  document.getElementById('userAvatar').src = state.userProfile.picture || '';
  document.getElementById('userName').textContent = state.userProfile.name || state.userProfile.email || '';
  el.style.display = 'flex';
}

function signOut(message) {
  state.idToken = null;
  state.userProfile = null;
  state.transactions = [];
  state.categories = [];
  clearAllCaches();
  if (window.google && google.accounts && google.accounts.id) {
    // Prevents One Tap from silently re-selecting the same (possibly just-
    // rejected) account on the next prompt() — the user has to explicitly
    // click the sign-in button again, which avoids a forbidden-account loop.
    google.accounts.id.disableAutoSelect();
  }
  showSignInGate(message);
  initGoogleSignIn();
}

// ---------- Bootstrap ----------
async function bootstrap() {
  const email = state.userProfile && state.userProfile.email;
  if (email) {
    const cached = localStorage.getItem(cacheKeyFor(email));
    if (cached) {
      try {
        applyData(JSON.parse(cached));
      } catch (e) { /* ignore */ }
    }
  }
  try {
    const data = await api.post('bootstrap', {});
    if (email) localStorage.setItem(cacheKeyFor(email), JSON.stringify(data));
    applyData(data);
  } catch (err) {
    console.error(err);
    if (err.message === 'AUTH_FORBIDDEN') {
      signOut('บัญชีนี้ยังไม่ได้รับอนุญาตให้ใช้แอปนี้ — ติดต่อเจ้าของแอปให้เพิ่มอีเมลนี้ในชีต AllowedUsers');
    } else if (String(err.message).indexOf('AUTH') === 0) {
      signOut('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
    } else {
      toast('โหลดข้อมูลไม่สำเร็จ: ' + err.message);
    }
  }
}

function applyData(data) {
  state.transactions = data.transactions || [];
  state.categories = data.categories || [];
  if (!state.monthCursor) {
    const d = new Date();
    state.monthCursor = { y: d.getFullYear(), m: d.getMonth() + 1 };
  }
  renderCategorySelect();
  renderAll();
}

function renderAll() {
  renderStatRow();
  renderMonthSection();
  renderOverview();
}

// ---------- Category select (in the add/edit transaction form) ----------
function renderCategorySelect() {
  const sel = document.getElementById('f-category');
  const prev = sel.value;
  const groups = {};
  state.categories.forEach(c => {
    groups[c.group] = groups[c.group] || [];
    groups[c.group].push(c);
  });
  sel.innerHTML = '';
  Object.keys(groups).forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g;
    groups[g].forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      opt.dataset.group = c.group;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
  if (prev && state.categories.some(c => c.name === prev)) sel.value = prev;
}

function categoryGroup(name) {
  const c = state.categories.find(c => c.name === name);
  return c ? c.group : 'อื่นๆ';
}

// ---------- Shared month math ----------
function monthStats(y, m, dayLimit) {
  const key = `${y}-${String(m).padStart(2,'0')}`;
  let tx = state.transactions.filter(t => monthKeyOf(t.date) === key);
  if (dayLimit != null) {
    tx = tx.filter(t => parseInt(t.date.slice(8, 10), 10) <= dayLimit);
  }
  const total = tx.reduce((s,t) => s + t.amount, 0);
  const needTotal = tx.filter(t => t.group === 'จำเป็น').reduce((s,t) => s + t.amount, 0);
  const otherTotal = tx.filter(t => t.group === 'อื่นๆ').reduce((s,t) => s + t.amount, 0);
  return { tx, total, needTotal, otherTotal, count: tx.length };
}

function daysInMonth(y, m) {
  return new Date(y, m, 0).getDate();
}

function shiftedMonth(y, m, delta) {
  m += delta;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  return { y, m };
}

// ---------- Stat row ----------
function renderStatRow() {
  const { y, m } = state.monthCursor;
  const now = new Date();
  const isCurrentRealMonth = (y === now.getFullYear() && m === now.getMonth() + 1);
  // For the month in progress, only count day 1..today so the comparison
  // below isn't skewed by a partial month vs a full previous month.
  // For a fully-elapsed month this equals its own day count (no truncation).
  const dayLimit = isCurrentRealMonth ? now.getDate() : daysInMonth(y, m);

  const cur = monthStats(y, m, dayLimit);
  const prevYm = shiftedMonth(y, m, -1);
  const prevDayLimit = Math.min(dayLimit, daysInMonth(prevYm.y, prevYm.m));
  const prev = monthStats(prevYm.y, prevYm.m, prevDayLimit);

  document.getElementById('statMonthLabel').textContent = `${THAI_MONTHS_SHORT[m-1]} ${y}`;
  document.getElementById('statTotal').textContent = `${fmtMoney(cur.total)} บาท`;

  const deltaEl = document.getElementById('statDelta');
  const compareNote = isCurrentRealMonth ? ` (วันที่ 1-${dayLimit})` : '';
  if (prev.total > 0) {
    const pct = ((cur.total - prev.total) / prev.total) * 100;
    const up = pct > 0;
    deltaEl.innerHTML = `<span class="delta-badge ${up ? 'delta-up' : 'delta-down'}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}% เทียบช่วงเดียวกันเดือนก่อน${compareNote}</span>`;
  } else {
    deltaEl.innerHTML = `<span class="delta-badge delta-neutral">ไม่มีข้อมูลเดือนก่อนเทียบ</span>`;
  }
}

// ---------- Month section (breakdown + list) ----------
function shiftMonth(delta) {
  state.monthCursor = shiftedMonth(state.monthCursor.y, state.monthCursor.m, delta);
  renderStatRow();
  renderMonthSection();
}

function renderMonthSection() {
  const { y, m } = state.monthCursor;
  document.getElementById('monthLabel').textContent = `${THAI_MONTHS_FULL[m-1]} ${y}`;
  const { tx: monthTx, total, needTotal, otherTotal } = monthStats(y, m);
  const needPct = total ? (needTotal/total*100) : 0;
  const otherPct = total ? (otherTotal/total*100) : 0;

  document.getElementById('groupBar').innerHTML = `
    <span style="width:${needPct}%; background:var(--series-1)"></span>
    <span style="width:${otherPct}%; background:var(--series-2)"></span>
  `;
  document.getElementById('groupLegend').innerHTML = `
    <span><span class="dot dot-need"></span>จำเป็น ${fmtMoney(needTotal)}</span>
    <span><span class="dot dot-other"></span>อื่นๆ ${fmtMoney(otherTotal)}</span>
  `;

  // category breakdown — group comes from each transaction's own stored
  // group, not a live category-table lookup, so renaming/deleting a
  // category later never reclassifies historical entries.
  const byCat = {};
  monthTx.forEach(t => {
    if (!byCat[t.category]) byCat[t.category] = { amount: 0, group: t.group };
    byCat[t.category].amount += t.amount;
  });
  const catEntries = Object.entries(byCat).sort((a,b) => b[1].amount - a[1].amount);
  const maxCat = catEntries.length ? catEntries[0][1].amount : 1;
  document.getElementById('categoryBreakdown').innerHTML = catEntries.length ? catEntries.map(([cat, info]) => {
    const color = info.group === 'จำเป็น' ? 'var(--series-1)' : 'var(--series-2)';
    const pct = Math.max(2, (info.amount/maxCat*100));
    const icon = iconForCategoryName(cat);
    return `<div class="cat-row">
      <div class="cat-row-top"><span><span class="material-symbols-outlined cat-icon" style="color:${color}">${icon}</span>${escapeHtml(cat)}</span><span>${fmtMoney(info.amount)}</span></div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%; background:${color}"></div></div>
    </div>`;
  }).join('') : '<div class="empty-hint">ไม่มีรายการในเดือนนี้</div>';

  // transaction list for the month
  const listEl = document.getElementById('monthList');
  const sorted = [...monthTx].sort((a,b) => (b.date + (b.createdAt||'')).localeCompare(a.date + (a.createdAt||'')));
  listEl.innerHTML = sorted.length ? sorted.map(txRowHtml).join('') : '<div class="empty-hint">ไม่มีรายการในเดือนนี้</div>';
  bindTxRowActions(listEl);
}

function txRowHtml(t) {
  const iconClass = t.group === 'จำเป็น' ? 'cat-icon-need' : 'cat-icon-other';
  const icon = iconForCategoryName(t.category);
  return `
    <div class="tx-row" data-id="${t.id}">
      <div class="tx-main">
        <span class="tx-cat"><span class="material-symbols-outlined cat-icon ${iconClass}">${icon}</span>${escapeHtml(t.category)}</span>
        <span class="tx-meta">${t.date}${t.note ? ' · ' + escapeHtml(t.note) : ''}</span>
      </div>
      <div class="tx-amount">${fmtMoney(t.amount)}</div>
      <div class="tx-actions">
        <button data-act="edit" title="แก้ไข">✎</button>
        <button data-act="del" title="ลบ">🗑</button>
      </div>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bindTxRowActions(container) {
  container.querySelectorAll('.tx-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-act="edit"]').addEventListener('click', () => startEdit(id));
    row.querySelector('[data-act="del"]').addEventListener('click', () => removeTransaction(id));
  });
}

// ---------- Charts ----------
let trendChartInstance = null;
let rankChartInstance = null;

function chartTheme() {
  const styles = getComputedStyle(document.documentElement);
  const get = (name) => styles.getPropertyValue(name).trim();
  const textPrimary = get('--text-primary');
  const surfaceCard = get('--surface-card');
  return {
    styles,
    seriesColor: get('--series-1'),
    textMuted: get('--text-muted'),
    gridline: get('--gridline'),
    surfaceCard,
    // Tooltip chip styled like the app's own toast (inverted surface/ink
    // pair), so it never falls back to Chart.js's stock black bubble.
    tooltip: {
      backgroundColor: textPrimary,
      titleColor: surfaceCard,
      bodyColor: surfaceCard,
      padding: 10,
      cornerRadius: 8,
      displayColors: false,
    },
  };
}

function earliestTransactionMonth() {
  if (!state.transactions.length) return null;
  const minDate = state.transactions.reduce((min, t) => (t.date < min ? t.date : min), state.transactions[0].date);
  const [y, m] = minDate.split('-').map(Number);
  return { y, m };
}

// range: a month count (12/24/36) or 'ALL' for every month since the first transaction.
function monthKeysForRange(range) {
  const d = new Date();
  d.setDate(1);
  let count;
  if (range === 'ALL') {
    const earliest = earliestTransactionMonth();
    count = earliest ? (d.getFullYear() - earliest.y) * 12 + (d.getMonth() + 1 - earliest.m) + 1 : 1;
  } else {
    count = range;
  }
  const keys = [];
  for (let i = count - 1; i >= 0; i--) {
    const dd = new Date(d.getFullYear(), d.getMonth() - i, 1);
    keys.push({ y: dd.getFullYear(), m: dd.getMonth() + 1, key: `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}` });
  }
  return keys;
}

function renderOverview() {
  renderTrendChart();
  renderCategoryChart();
}

function renderTrendChart() {
  const months = monthKeysForRange(state.trendRange);
  const totals = months.map(mk => state.transactions.filter(t => monthKeyOf(t.date) === mk.key).reduce((s,t) => s+t.amount, 0));
  const labels = months.map(mk => `${THAI_MONTHS_SHORT[mk.m-1]} ${mk.y}`);
  const theme = chartTheme();

  const trendCtx = document.getElementById('trendChart');
  if (trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(trendCtx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: totals,
        backgroundColor: theme.seriesColor,
        borderRadius: 4,
        maxBarThickness: 32,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onClick: (evt, elements) => {
        if (!elements.length) return;
        const mk = months[elements[0].index];
        state.monthCursor = { y: mk.y, m: mk.m };
        renderStatRow();
        renderMonthSection();
        toast(`เปลี่ยนไปดูเดือน ${THAI_MONTHS_FULL[mk.m-1]} ${mk.y}`);
      },
      onHover: (evt, elements) => {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      plugins: {
        legend: { display: false },
        datalabels: { display: false },
        tooltip: { ...theme.tooltip, callbacks: { label: (c) => fmtMoney(c.parsed.y) + ' บาท' } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: theme.textMuted, autoSkip: true, maxRotation: 0 } },
        y: { grid: { color: theme.gridline }, ticks: { color: theme.textMuted, callback: (v) => fmtMoney(v) } },
      },
    },
  });
}

function renderCategoryChart() {
  const months = monthKeysForRange(12);
  const theme = chartTheme();
  const monthKeySet = new Set(months.map(mk => mk.key));
  const byCat = {};
  state.transactions.filter(t => monthKeySet.has(monthKeyOf(t.date))).forEach(t => {
    byCat[t.category] = (byCat[t.category] || 0) + t.amount;
  });
  let catEntries = Object.entries(byCat).sort((a,b) => b[1]-a[1]);

  // Cap at 7 explicit slices + "Other" — beyond that, same-family hues
  // become indistinguishable, so the rest folds into a residual bucket.
  const MAX_SLICES = 8;
  if (catEntries.length > MAX_SLICES) {
    const top = catEntries.slice(0, MAX_SLICES - 1);
    const restTotal = catEntries.slice(MAX_SLICES - 1).reduce((s, e) => s + e[1], 0);
    catEntries = [...top, ['อื่นๆ', restTotal]];
  }
  const catColors = [1,2,3,4,5,6,7,8].map(n => theme.styles.getPropertyValue(`--cat-${n}`).trim());
  const catTotal = catEntries.reduce((s, e) => s + e[1], 0);
  const pctOf = (v) => catTotal ? (v / catTotal * 100) : 0;

  const rankCtx = document.getElementById('rankChart');
  if (rankChartInstance) rankChartInstance.destroy();
  rankChartInstance = new Chart(rankCtx, {
    type: 'doughnut',
    data: {
      labels: catEntries.map(e => e[0]),
      datasets: [{
        data: catEntries.map(e => e[1]),
        backgroundColor: catEntries.map((_, i) => catColors[i % catColors.length]),
        borderColor: theme.surfaceCard,
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '62%',
      plugins: {
        legend: { position: 'bottom', labels: { color: theme.textMuted, boxWidth: 10, padding: 12 } },
        tooltip: { ...theme.tooltip, callbacks: { label: (c) => `${c.label}: ${fmtMoney(c.parsed)} บาท (${pctOf(c.parsed).toFixed(1)}%)` } },
        datalabels: {
          color: '#fff',
          font: { weight: '700', size: 12 },
          textStrokeColor: 'rgba(0,0,0,0.35)',
          textStrokeWidth: 2,
          formatter: (value) => { const pct = pctOf(value); return pct >= 5 ? pct.toFixed(0) + '%' : ''; },
        },
      },
    },
  });
}

// ---------- Add / Edit transaction modal ----------
function openAddModal() {
  state.editingId = null;
  document.getElementById('addForm').reset();
  document.getElementById('f-date').value = todayISO();
  document.getElementById('txModalTitle').textContent = 'Add Transaction';
  document.getElementById('f-submit').textContent = 'เพิ่มรายการ';
  document.getElementById('txModal').classList.add('show');
}

function startEdit(id) {
  const t = state.transactions.find(t => t.id === id);
  if (!t) return;
  state.editingId = id;
  document.getElementById('f-date').value = t.date;
  document.getElementById('f-category').value = t.category;
  document.getElementById('f-amount').value = t.amount;
  document.getElementById('f-note').value = t.note || '';
  document.getElementById('txModalTitle').textContent = 'Edit Transaction';
  document.getElementById('f-submit').textContent = 'บันทึกการแก้ไข';
  document.getElementById('txModal').classList.add('show');
}

function closeTxModal() {
  document.getElementById('txModal').classList.remove('show');
  state.editingId = null;
}

async function handleFormSubmit(e) {
  e.preventDefault();
  const date = document.getElementById('f-date').value;
  const category = document.getElementById('f-category').value;
  const amount = parseFloat(document.getElementById('f-amount').value);
  const note = document.getElementById('f-note').value.trim();
  const group = categoryGroup(category);

  if (!date || !category || isNaN(amount)) { toast('กรอกข้อมูลให้ครบ'); return; }

  const payload = { date, category, group, amount, note };
  const submitBtn = document.getElementById('f-submit');
  submitBtn.disabled = true;
  try {
    if (state.editingId) {
      payload.id = state.editingId;
      const updated = await api.post('update', payload);
      const idx = state.transactions.findIndex(t => t.id === state.editingId);
      if (idx !== -1) state.transactions[idx] = { ...state.transactions[idx], ...updated };
      toast('แก้ไขรายการแล้ว');
    } else {
      const created = await api.post('add', payload);
      state.transactions.push(created);
      toast('เพิ่มรายการแล้ว');
    }
    persistCache();
    closeTxModal();
    renderAll();
  } catch (err) {
    toast('บันทึกไม่สำเร็จ: ' + err.message);
  } finally {
    submitBtn.disabled = false;
  }
}

async function removeTransaction(id) {
  if (!confirm('ลบรายการนี้?')) return;
  try {
    await api.post('delete', { id });
    state.transactions = state.transactions.filter(t => t.id !== id);
    persistCache();
    toast('ลบรายการแล้ว');
    renderAll();
  } catch (err) {
    toast('ลบไม่สำเร็จ: ' + err.message);
  }
}

// ---------- Category management modal ----------
let newCategoryIcon = 'sell';

function openCategoryModal() {
  newCategoryIcon = 'sell';
  renderCategoryManageList();
  renderIconPicker('nc-icon-picker', newCategoryIcon, (icon) => { newCategoryIcon = icon; });
  document.getElementById('categoryModal').classList.add('show');

function closeCategoryModal() {
  document.getElementById('categoryModal').classList.remove('show');
}

function renderCategoryManageList() {
  const el = document.getElementById('categoryManageList');
  if (!state.categories.length) { el.innerHTML = '<div class="empty-hint">ยังไม่มีหมวดหมู่</div>'; return; }
  el.innerHTML = state.categories.map(categoryManageRowHtml).join('');
  bindCategoryManageActions();
}

function categoryManageRowHtml(c) {
  const iconClass = c.group === 'จำเป็น' ? 'cat-icon-need' : 'cat-icon-other';
  const icon = c.icon || DEFAULT_ICON_MAP[c.name] || 'sell';
  return `<div class="cat-manage-row" data-name="${escapeHtml(c.name)}">
    <span class="cat-manage-name"><span class="material-symbols-outlined cat-icon ${iconClass}">${icon}</span>${escapeHtml(c.name)}</span>
    <div class="cat-manage-actions">
      <button data-act="edit" title="แก้ไข">✎</button>
      <button data-act="del" title="ลบ">🗑</button>
    </div>
  </div>`;
}

function bindCategoryManageActions() {
  document.querySelectorAll('#categoryManageList .cat-manage-row').forEach(row => {
    const name = row.dataset.name;
    row.querySelector('[data-act="edit"]').addEventListener('click', () => enterCategoryEditMode(row, name));
    row.querySelector('[data-act="del"]').addEventListener('click', () => deleteCategoryUI(name));
  });
}

let editingCategoryIcon = 'sell';

function enterCategoryEditMode(row, name) {
  const c = state.categories.find(c => c.name === name);
  if (!c) return;
  editingCategoryIcon = c.icon || DEFAULT_ICON_MAP[c.name] || 'sell';
  row.classList.add('editing');
  row.innerHTML = `
    <div class="cat-edit-fields">
      <div class="cat-edit-top">
        <input type="text" class="cat-edit-name" value="${escapeHtml(c.name)}">
        <select class="cat-edit-group">
          <option value="จำเป็น" ${c.group === 'จำเป็น' ? 'selected' : ''}>จำเป็น</option>
          <option value="อื่นๆ" ${c.group === 'อื่นๆ' ? 'selected' : ''}>อื่นๆ</option>
        </select>
      </div>
      <div class="icon-picker" id="cat-edit-icon-picker"></div>
    </div>
    <div class="cat-manage-actions">
      <button data-act="save" title="บันทึก">✓</button>
      <button data-act="cancel" title="ยกเลิก">✕</button>
    </div>
  `;
  renderIconPicker('cat-edit-icon-picker', editingCategoryIcon, (icon) => { editingCategoryIcon = icon; });
  row.querySelector('[data-act="save"]').addEventListener('click', () => saveCategoryEdit(name, row));
  row.querySelector('[data-act="cancel"]').addEventListener('click', renderCategoryManageList);
}

async function saveCategoryEdit(oldName, row) {
  const newName = row.querySelector('.cat-edit-name').value.trim();
  const newGroup = row.querySelector('.cat-edit-group').value;
  const newIcon = editingCategoryIcon;
  if (!newName) { toast('กรอกชื่อหมวดหมู่'); return; }
  try {
    await api.post('updateCategory', { oldName, name: newName, group: newGroup, icon: newIcon });
    const idx = state.categories.findIndex(c => c.name === oldName);
    if (idx !== -1) state.categories[idx] = { ...state.categories[idx], name: newName, group: newGroup, icon: newIcon };
    state.transactions.forEach(t => {
      if (t.category === oldName) { t.category = newName; t.group = newGroup; }
    });
    persistCache();
    toast('แก้ไขหมวดหมู่แล้ว');
    renderCategorySelect();
    renderCategoryManageList();
    renderAll();
  } catch (err) {
    toast('แก้ไขไม่สำเร็จ: ' + err.message);
  }
}

async function deleteCategoryUI(name) {
  if (!confirm(`ลบหมวดหมู่ "${name}"? (รายการเก่าที่ใช้หมวดหมู่นี้จะยังอยู่)`)) return;
  try {
    await api.post('deleteCategory', { name });
    state.categories = state.categories.filter(c => c.name !== name);
    persistCache();
    toast('ลบหมวดหมู่แล้ว');
    renderCategorySelect();
    renderCategoryManageList();
  } catch (err) {
    toast('ลบไม่สำเร็จ: ' + err.message);
  }
}

async function addCategoryUI() {
  const nameInput = document.getElementById('nc-name');
  const name = nameInput.value.trim();
  const group = document.getElementById('nc-group').value;
  if (!name) { toast('กรอกชื่อหมวดหมู่'); return; }
  if (state.categories.some(c => c.name === name)) { toast('มีหมวดหมู่นี้อยู่แล้ว'); return; }
  try {
    const created = await api.post('addCategory', { name, group, icon: newCategoryIcon });
    state.categories.push(created);
    nameInput.value = '';
    newCategoryIcon = 'sell';
    renderIconPicker('nc-icon-picker', newCategoryIcon, (icon) => { newCategoryIcon = icon; });
    persistCache();
    toast('เพิ่มหมวดหมู่แล้ว');
    renderCategorySelect();
    renderCategoryManageList();
  } catch (err) {
    toast('เพิ่มไม่สำเร็จ: ' + err.message);
  }
}

// ---------- CSV export ----------
function exportCsv() {
  const header = 'date,category,group,amount,note\n';
  const rows = [...state.transactions]
    .sort((a,b) => a.date.localeCompare(b.date))
    .map(t => [t.date, t.category, t.group, t.amount, (t.note||'').replace(/"/g,'""')]
      .map(v => /[,"\n]/.test(String(v)) ? `"${v}"` : v).join(','));
  const blob = new Blob(['﻿' + header + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `expenses-${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}


// ---------- Init ----------
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-date').value = todayISO();
  document.getElementById('addForm').addEventListener('submit', handleFormSubmit);
  document.getElementById('f-cancel').addEventListener('click', closeTxModal);
  document.getElementById('addBtn').addEventListener('click', openAddModal);
  document.getElementById('prevMonth').addEventListener('click', () => shiftMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => shiftMonth(1));
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('categoryBtn').addEventListener('click', openCategoryModal);
  document.getElementById('cat-close').addEventListener('click', closeCategoryModal);
  document.getElementById('nc-add').addEventListener('click', addCategoryUI);
  document.getElementById('signOutBtn').addEventListener('click', signOut);
  document.querySelectorAll('#trendRangeToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#trendRangeToggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const range = btn.dataset.range;
      state.trendRange = range === 'ALL' ? 'ALL' : Number(range);
      renderTrendChart();
    });
  });
  initApp();
});

// Chart.js can end up with a stale/zero canvas size after the browser
// window is minimized and restored (layout happens while hidden, so the
// resize observer never sees the real dimensions). Force a resize whenever
// the page becomes visible or the viewport size changes again.
function resizeCharts() {
  if (trendChartInstance) trendChartInstance.resize();
  if (rankChartInstance) rankChartInstance.resize();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') resizeCharts();
});
window.addEventListener('focus', resizeCharts);
window.addEventListener('resize', resizeCharts);
</script>
